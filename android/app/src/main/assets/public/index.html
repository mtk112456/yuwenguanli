<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>班级成长助教</title>
<style>
  body { margin:0; min-height:100vh; min-height:100dvh; display:flex; align-items:center; justify-content:center;
         background:#1e3a5f; color:#f8fafc; font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;
         text-align:center; padding:24px; box-sizing:border-box; }
  .spinner { width:44px; height:44px; border:3px solid rgba(255,255,255,.18); border-top-color:#f8fafc;
             border-radius:50%; animation:spin .8s linear infinite; margin:0 auto 18px; }
  @keyframes spin { to { transform:rotate(360deg); } }
  h1 { font-size:19px; font-weight:600; margin:0 0 8px; }
  p { font-size:13.5px; color:rgba(248,250,252,.72); line-height:1.7; margin:0; }
  button { margin-top:20px; min-height:46px; padding:0 28px; border:none; border-radius:12px;
           background:rgba(255,255,255,.14); color:#f8fafc; font-size:15px; font-weight:600; }
</style>
</head>
<body>
  <div>
    <div class="spinner"></div>
    <h1>班级成长助教 · 教师端</h1>
    <p>正在连接教学系统…<br>若长时间未进入，请检查网络后重试</p>
    <button onclick="location.reload()">重新连接</button>
  </div>
</body>
</html>
